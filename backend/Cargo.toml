[package]
name = "ashkey"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ashkey: encrypted vault and dead man's switch on the Internet Computer, paid in Monero"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
candid = "0.10"
ic-cdk = "0.20"
ic-cdk-timers = "1.0"
ic-cdk-management-canister = "0.3"
ic-stable-structures = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
monero = { version = "0.21", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
panic = "abort"
